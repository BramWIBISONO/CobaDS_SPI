{% if messages %}<div class="mb-5 space-y-2">{% for m in messages %}
  <div class="callout {% if m.tags == 'error' %}callout-danger{% elif m.tags == 'warning' %}callout-warning{% elif m.tags == 'success' %}border-success-100 bg-success-50 text-success-700{% else %}callout-info{% endif %}" role="status">
    <i class="ti ti-{% if m.tags == 'error' %}alert-circle{% elif m.tags == 'success' %}circle-check{% elif m.tags == 'warning' %}alert-triangle{% else %}info-circle{% endif %}" aria-hidden="true"></i><p>{{ m }}</p></div>
{% endfor %}</div>{% endif %}

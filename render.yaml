services:

  - type: web
    name: cobads-spi
    runtime: python
    plan: free

    buildCommand: "bash build.sh"

    startCommand: "python -m gunicorn spi_web.wsgi:application -k uvicorn.workers.UvicornWorker"

    envVars:

      - key: DATABASE_URL
        fromDatabase:
          name: cobads-spi-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: WEB_CONCURRENCY
        value: "2"

databases:

  - name: cobads-spi-db
    plan: free
    databaseName: cobads_spi
    user: cobads_spi

{% if field.field.widget.input_type == "checkbox" %}
  <label class="flex cursor-pointer items-start gap-2.5 rounded-lg py-1 text-sm text-ink-2">{{ field }}<span>{{ field.label }}{% if field.help_text %}<span class="field-hint mt-0.5">{{ field.help_text }}</span>{% endif %}</span></label>
{% else %}
  <div class="field-group">
    <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}{% if field.field.required %} <span class="text-danger-600" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="field-hint">{{ field.help_text }}</p>{% endif %}
  </div>
{% endif %}
{% if field.errors %}<ul class="errorlist" role="alert">{% for e in field.errors %}<li><i class="ti ti-alert-circle mt-0.5" aria-hidden="true"></i>{{ e }}</li>{% endfor %}</ul>{% endif %}

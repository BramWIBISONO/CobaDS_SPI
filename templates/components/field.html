{% if field.field.widget.input_type == "checkbox" %}
  <label class="flex items-start gap-2 text-sm text-slate-700">{{ field }}<span>{{ field.label }}</span></label>
{% else %}
  <div>
    <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}{% if field.field.required %} <span class="text-red-600" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  </div>
{% endif %}
{% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}

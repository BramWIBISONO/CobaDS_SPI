<div class="empty {% if bare %}py-8{% else %}rounded-2xl border border-dashed border-line-strong bg-surface{% endif %}">
  <span class="empty-icon"><i class="ti ti-{{ icon|default:'inbox' }}" aria-hidden="true"></i></span>
  <p class="empty-title">{{ title }}</p>
  {% if text %}<p class="empty-text">{{ text }}</p>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary mt-3">{% if action_icon %}<i class="ti ti-{{ action_icon }}" aria-hidden="true"></i>{% endif %}{{ action_label }}</a>{% endif %}
</div>

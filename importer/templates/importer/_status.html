{% if run.status == "COMMITTED" %}<span class="status-badge st-baik"><span class="dot" aria-hidden="true"></span>Tersimpan</span>
{% elif run.status == "FAILED" %}<span class="status-badge st-kritis"><span class="dot" aria-hidden="true"></span>Gagal</span>
{% elif run.report.ok %}<span class="status-badge st-info"><span class="dot" aria-hidden="true"></span>Pratinjau</span>
{% else %}<span class="status-badge st-kritis"><span class="dot" aria-hidden="true"></span>Ada error</span>{% endif %}
